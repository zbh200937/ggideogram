name: R-CMD-check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  R-CMD-check:
    name: ggplot2 (${{ matrix.config.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: release
            packages: any::ggplot2
            force-suggests: 'true'
          - name: '3.5.0'
            packages: |
              ggplot2@3.5.0
              ggrepel@0.9.6
              patchwork@1.2.0
              cowplot@1.1.3
              ggiraph=?ignore
            force-suggests: 'false'
    env:
      _R_CHECK_FORCE_SUGGESTS_: ${{ matrix.config.force-suggests }}
    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            ${{ matrix.config.packages }}
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual")'
          error-on: '"warning"'
